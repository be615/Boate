<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Daily Activities Hub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#172033;
    transition:.3s;
}

body.dark{
    background:#0f172a;
    color:#fff;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    font-size:32px;
    margin-bottom:8px;
}

header p{
    opacity:.9;
}

nav{
    background:#fff;
    padding:12px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 3px 15px #0001;
}

.dark nav{
    background:#1e293b;
}
